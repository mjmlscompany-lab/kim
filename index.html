<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기초상품 입력 폼 시안</title>
<style>
  :root{
    --bg:#121214; --panel:#1c1c1f; --border:#3a3a3e; --border-strong:#55555a;
    --text:#ececeb; --text-muted:#9a9a9f; --green:#4ade80; --red:#ff6b6b; --gray-bg:#232326;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;
    background:var(--bg); color:var(--text); margin:0; padding:32px; font-size:14px;
  }
  .wrap{max-width:1040px; margin:0 auto;}
  h1{font-size:16px; font-weight:600; margin:0 0 20px; color:#d8d8d6;}
  .form-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:20px 32px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:13px; font-weight:600; display:flex; align-items:center; gap:4px;}
  label .check{color:var(--green); font-size:13px;}
  input[type=text], select, textarea{
    border:1px solid var(--border); border-radius:3px; padding:6px 8px;
    font-size:13px; height:32px; background:var(--panel); color:var(--text);
    width:100%;
  }
  input[readonly]{background:#18181a; color:#b8b8b6;}
  .filebar{display:flex; align-items:center; gap:10px;}
  .filebar button{
    border:1px solid var(--border-strong); background:var(--panel); color:var(--text); border-radius:3px;
    padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .filebar span{font-size:12px; color:var(--text-muted);}
  .thumbs{display:flex; gap:6px; margin-top:8px; position:relative;}
  .thumbs img{width:56px; height:56px; object-fit:cover; border-radius:4px; border:1px solid var(--border);}
  .thumbs .close{
    position:absolute; top:-8px; right:-8px; color:var(--red); font-size:14px;
    background:var(--panel); border-radius:50%; width:18px; height:18px; display:flex;
    align-items:center; justify-content:center; cursor:pointer;
  }
  .days{display:flex; gap:6px;}
  .day{
    width:36px; height:32px; border:1px solid var(--border-strong); border-radius:3px;
    background:var(--panel); display:flex; align-items:center; justify-content:center;
    font-size:13px; cursor:pointer; color:var(--text);
  }
  .day.off{background:var(--gray-bg); color:var(--text-muted);}
  .day.selected{background:#3a1616; border-color:var(--red); color:var(--red); font-weight:600;}
  .hint{font-size:12px; color:var(--text-muted); margin-top:24px;}
  button{
    background:var(--text); color:#111; border:none; border-radius:4px;
    padding:8px 14px; font-size:13px; cursor:pointer; font-weight:600;
  }
  button.secondary{
    background:var(--panel); color:var(--text); border:1px solid var(--border-strong);
  }
  .card{background:var(--panel); border-color:var(--border);}
  .tab-btn{
    border:1px solid var(--border-strong); background:var(--panel); color:var(--text);
    border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer;
  }
  .tab-btn.active{
    background:var(--text); color:#111; border-color:var(--text); font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>① 시트 불러오기</h1>
  <div class="card" style="border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:24px;">
    <textarea id="pasteArea" style="width:100%; min-height:320px; border:1px solid var(--border); border-radius:6px; padding:10px; font-size:12px; font-family:ui-monospace,Menlo,monospace; background:var(--panel); color:var(--text);" placeholder="구글 시트에서 헤더 행을 포함해 복사한 내용을 여기에 붙여넣으세요"></textarea>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button type="button" id="parseSheetBtn">시트 불러오기</button>
      <button type="button" class="secondary" id="clearSheetBtn">지우기</button>
      <input type="text" id="facilitySearch" placeholder="업체명 검색" style="flex:1; max-width:260px;">
    </div>
    <div id="sheetStatus" style="font-size:12px; color:var(--text-muted); margin-top:8px;"></div>
    <div id="facilityTabs" style="display:none; flex-wrap:wrap; gap:6px; margin-top:12px;"></div>
  </div>

  <h1>② 기초상품 입력 폼 (시안 2차 — 전체 필드)</h1>

  <div class="form-grid">
    <div class="field">
      <label><span class="check">✓</span> 공급처</label>
      <input type="text" id="f-supplier" value="[서산] 명가네힐링농장" readonly>
    </div>
    <div class="field">
      <label><span class="check">✓</span> 상태</label>
      <select id="f-status">
        <option selected>정상</option>
        <option>중지</option>
        <option>대기</option>
      </select>
    </div>

    <div class="field">
      <label><span class="check">✓</span> 기초상품명</label>
      <input type="text" id="f-productname" value="BVT_[충남/서산] 명가네힐링농장" readonly>
    </div>

    <div class="field full">
      <label><span class="check">✓</span> 간편설명</label>
      <input type="text" id="f-shortdesc" value="머핀 쿠킹 체험" readonly>
    </div>

    <textarea id="raw-shortdesc" style="display:none;"></textarea>

    <div class="field full">
      <label>휴일</label>
      <div class="days" id="f-days">
        <div class="day" data-day="일">일</div>
        <div class="day" data-day="월">월</div>
        <div class="day" data-day="화">화</div>
        <div class="day" data-day="수">수</div>
        <div class="day" data-day="목">목</div>
        <div class="day" data-day="금">금</div>
        <div class="day" data-day="토">토</div>
      </div>
    </div>

    <textarea id="raw-holiday" style="display:none;"></textarea>

    <div class="field">
      <label>예약필수여부</label>
      <select id="f-reserve">
        <option selected>예</option>
        <option>아니오</option>
      </select>
    </div>
    <div class="field">
      <label>스케줄타입</label>
      <select id="f-schedule">
        <option>온라인예약</option>
        <option selected>전화예약</option>
        <option>숙박판매예약</option>
        <option>카카오톡예약</option>
      </select>
    </div>

    <div class="field">
      <label><span class="check">✓</span> 영업 시작시간</label>
      <input type="text" id="f-opentime" placeholder="예: 09:00">
    </div>
    <div class="field">
      <label><span class="check">✓</span> 영업 종료시간</label>
      <input type="text" id="f-closetime" placeholder="예: 18:00">
    </div>

    <input type="text" id="raw-hours" style="display:none;">
    <textarea id="raw-hours-display" style="display:none;"></textarea>
  </div>

  <hr style="margin:32px 0; border:none; border-top:1px solid var(--border);">
  <h1>기초상품 입력 폼 (하단부)</h1>

  <div class="form-grid">
    <div class="field full">
      <label>유의사항 <span style="font-weight:400; color:var(--text-muted); font-size:12px;">(제목 + 유의사항 + 업체소개 + 주소 + 연락처 + 운영시간 + 휴무안내가 한 번에 합쳐져요)</span></label>
      <div id="usagePreview" contenteditable="true" style="width:100%; min-height:180px; border:1px solid var(--border); border-radius:6px; padding:12px; font-size:13px; font-family:inherit; line-height:1.7; background:var(--panel); color:var(--text);"></div>
    </div>
  </div>

  <div style="display:flex; justify-content:flex-end; gap:8px; margin:12px 0 8px;">
    <button type="button" id="genPreviewBtn">유의사항 텍스트 생성</button>
    <button type="button" class="secondary" id="copyPreviewBtn">복사하기</button>
  </div>

  <div style="display:none;">
    <textarea id="raw-notice-visible"></textarea>
    <textarea id="raw-intro-visible"></textarea>
    <textarea id="raw-phone-visible"></textarea>
    <textarea id="raw-address-plain-visible"></textarea>
  </div>

  <script>
    const dayChars = ['일','월','화','수','목','금','토'];
    let closedDaysList = [];

    function highlightHolidays(raw) {
      document.querySelectorAll('.day').forEach(el => el.classList.remove('selected'));
      closedDaysList = [];
      if (!raw || !raw.trim()) return;
      const tokens = raw.split(/[,\n\/]/).map(t => t.trim()).filter(Boolean);
      const matched = new Set();
      tokens.forEach(tok => {
        dayChars.forEach(d => {
          if (tok === d || tok === d + '요일') matched.add(d);
        });
      });
      matched.forEach(d => {
        const el = document.querySelector(`.day[data-day="${d}"]`);
        if (el) el.classList.add('selected');
      });
      closedDaysList = dayChars.filter(d => matched.has(d));
    }

    function parseHours(raw) {
      if (!raw || !raw.trim()) return null;
      const regex = /(\d{1,2})(?::(\d{2}))?\s*시?\s*~\s*(\d{1,2})(?::(\d{2}))?\s*시?/g;
      let match;
      const starts = [];
      const ends = [];
      while ((match = regex.exec(raw)) !== null) {
        const sh = parseInt(match[1], 10);
        const sm = match[2] ? parseInt(match[2], 10) : 0;
        const eh = parseInt(match[3], 10);
        const em = match[4] ? parseInt(match[4], 10) : 0;
        starts.push(sh * 60 + sm);
        ends.push(eh * 60 + em);
      }
      if (starts.length === 0) return null;
      const minStart = Math.min(...starts);
      const maxEnd = Math.max(...ends);
      const fmt = (mins) => {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };
      return { start: fmt(minStart), end: fmt(maxEnd) };
    }

    document.getElementById('raw-shortdesc').addEventListener('input', (e) => {
      document.getElementById('f-shortdesc').value = e.target.value;
    });

    document.getElementById('raw-hours').addEventListener('input', (e) => {
      const result = parseHours(e.target.value);
      document.getElementById('f-opentime').value = result ? result.start : '';
      document.getElementById('f-closetime').value = result ? result.end : '';
    });

    document.getElementById('raw-holiday').addEventListener('input', (e) => {
      highlightHolidays(e.target.value);
    });

    function formatNotes(raw) {
      if (!raw || !raw.trim()) return '';
      const lines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');
      return lines.map((l, idx) => {
        const stripped = l.replace(/^[-·\u2022]\s*/, '');
        return `${idx + 1}. ${stripped}`;
      }).join('\n');
    }

    function extractFacilityName() {
      const raw = document.getElementById('f-supplier').value || '';
      return raw.replace(/^\[[^\]]*\]\s*/, '').trim();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function generateUsagePreview() {
      const name = extractFacilityName();
      const noticeRaw = document.getElementById('raw-notice-visible').value;
      const noticeLines = noticeRaw.split('\n').map(l => l.trim()).filter(l => l !== '')
        .map(l => l.replace(/^[-·\u2022]\s*/, ''));
      const intro = document.getElementById('raw-intro-visible').value.trim();
      const addr = document.getElementById('raw-address-plain-visible').value.trim();
      const phone = document.getElementById('raw-phone-visible').value.trim();
      const hoursRaw = document.getElementById('raw-hours-display').value.trim();
      const hoursLines = hoursRaw.split('\n').map(l => l.trim()).filter(Boolean);
      const closedText = closedDaysList.length > 0 ? closedDaysList.join(', ') : '연중무휴';

      let html = `<div>[${escapeHtml(name)} 이용안내]</div><div><br></div>`;
      if (noticeLines.length > 0) {
        noticeLines.forEach((l, idx) => {
          if (idx === 0) {
            html += `<div><strong style="color:#e02b2b;">${idx + 1}. ${escapeHtml(l)}</strong></div>`;
          } else {
            html += `<div>${idx + 1}. ${escapeHtml(l)}</div>`;
          }
        });
        html += `<div><br></div>`;
      }
      if (intro) html += `<div>${escapeHtml(intro)}</div><div><br></div>`;
      html += `<div>주소 : 충남 ${escapeHtml(addr)}</div>`;
      html += `<div>전화번호 : ${escapeHtml(phone)}</div>`;
      if (hoursLines.length === 0) {
        html += `<div>운영시간 : </div>`;
      } else {
        html += `<div>운영시간 : ${escapeHtml(hoursLines[0])}</div>`;
        for (let i = 1; i < hoursLines.length; i++) {
          html += `<div>${escapeHtml(hoursLines[i])}</div>`;
        }
      }
      html += `<div>휴무안내 : ${escapeHtml(closedText)}</div>`;

      document.getElementById('usagePreview').innerHTML = html;
    }

    document.getElementById('genPreviewBtn').addEventListener('click', generateUsagePreview);

    document.getElementById('copyPreviewBtn').addEventListener('click', () => {
      const el = document.getElementById('usagePreview');
      const html = el.innerHTML;
      const plain = el.innerText;
      const done = () => {
        const btn = document.getElementById('copyPreviewBtn');
        const orig = btn.textContent;
        btn.textContent = '복사됨!';
        setTimeout(() => { btn.textContent = orig; }, 1200);
      };
      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        });
        navigator.clipboard.write([item]).then(done).catch(() => {
          navigator.clipboard.writeText(plain).then(done);
        });
      } else {
        navigator.clipboard.writeText(plain).then(done);
      }
    });
  </script>

  <p class="hint">유의사항 텍스트는 굵은 빨간 글씨로 표시되고, 복사하기를 누르면 서식이 그대로 유지된 채 복사돼요 (실제 유의사항 입력창이 리치텍스트 에디터라면 서식 그대로 붙여넣기 됩니다).</p>

  <hr style="margin:32px 0; border:none; border-top:1px solid var(--border);">
  <h1>금액정보</h1>

  <div class="form-grid">
    <div class="field">
      <label><span class="check">✓</span> 기초상품표시명</label>
      <input type="text" id="f-pricename" value="[충남] 여미도예" readonly>
    </div>
  </div>

  <table style="width:100%; border-collapse:collapse; margin-top:16px; font-size:13px;">
    <thead>
      <tr style="background:#111; color:#fff;">
        <th style="padding:8px; text-align:center;">권종</th>
        <th style="padding:8px; text-align:center;">정상가</th>
        <th style="padding:8px; text-align:center;">판매가</th>
        <th style="padding:8px; text-align:center;">정액정산가</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="padding:8px; border:1px solid var(--border); text-align:center;">성인</td>
        <td style="padding:0; border:1px solid var(--border);"><input type="text" id="f-price-adult-normal" style="width:100%; border:none; text-align:right; padding:8px;" placeholder="0"></td>
        <td style="padding:8px; border:1px solid var(--border); text-align:right; color:var(--text-muted);">0</td>
        <td style="padding:0; border:1px solid var(--border);"><input type="text" id="f-price-adult-settle" style="width:100%; border:none; text-align:right; padding:8px;" placeholder="0"></td>
      </tr>
      <tr>
        <td style="padding:8px; border:1px solid var(--border); text-align:center;">청소년</td>
        <td style="padding:0; border:1px solid var(--border);"><input type="text" id="f-price-teen-normal" style="width:100%; border:none; text-align:right; padding:8px;" placeholder="0"></td>
        <td style="padding:8px; border:1px solid var(--border); text-align:right; color:var(--text-muted);">0</td>
        <td style="padding:0; border:1px solid var(--border);"><input type="text" id="f-price-teen-settle" style="width:100%; border:none; text-align:right; padding:8px;" placeholder="0"></td>
      </tr>
      <tr>
        <td style="padding:8px; border:1px solid var(--border); text-align:center;">소인</td>
        <td style="padding:0; border:1px solid var(--border);"><input type="text" id="f-price-child-normal" style="width:100%; border:none; text-align:right; padding:8px;" placeholder="0"></td>
        <td style="padding:8px; border:1px solid var(--border); text-align:right; color:var(--text-muted);">0</td>
        <td style="padding:0; border:1px solid var(--border);"><input type="text" id="f-price-child-settle" style="width:100%; border:none; text-align:right; padding:8px;" placeholder="0"></td>
      </tr>
    </tbody>
  </table>

  <div style="display:none;">
    <input type="text" id="raw-region" value="충남">
    <input type="text" id="raw-facilityname-price">
    <input type="text" id="raw-adult-normal">
    <input type="text" id="raw-adult-settle">
    <input type="text" id="raw-teen-normal">
    <input type="text" id="raw-teen-settle">
    <input type="text" id="raw-child-normal">
    <input type="text" id="raw-child-settle">
  </div>

  <script>
    function syncPriceFields() {
      const region = document.getElementById('raw-region').value.trim();
      const facility = document.getElementById('raw-facilityname-price').value.trim();
      document.getElementById('f-pricename').value = facility ? `[${region}] ${facility}` : `[${region}]`;

      document.getElementById('f-price-adult-normal').value = document.getElementById('raw-adult-normal').value;
      document.getElementById('f-price-adult-settle').value = document.getElementById('raw-adult-settle').value;
      document.getElementById('f-price-teen-normal').value = document.getElementById('raw-teen-normal').value;
      document.getElementById('f-price-teen-settle').value = document.getElementById('raw-teen-settle').value;
      document.getElementById('f-price-child-normal').value = document.getElementById('raw-child-normal').value;
      document.getElementById('f-price-child-settle').value = document.getElementById('raw-child-settle').value;
    }

    ['raw-region', 'raw-facilityname-price', 'raw-adult-normal', 'raw-adult-settle',
     'raw-teen-normal', 'raw-teen-settle', 'raw-child-normal', 'raw-child-settle'].forEach(id => {
      document.getElementById(id).addEventListener('input', syncPriceFields);
    });
  </script>

  <script>
    let sheetRows = [];
    let sheetHeaderMap = {};

    function parseTSV(text) {
      const flat = text.replace(/\r\n/g, '\n');
      const parsedRows = [];
      let current = [];
      let cell = '';
      let inQuotes = false;
      let i = 0;
      while (i < flat.length) {
        const ch = flat[i];
        if (inQuotes) {
          if (ch === '"') {
            if (flat[i + 1] === '"') { cell += '"'; i += 2; continue; }
            inQuotes = false; i++; continue;
          }
          cell += ch; i++; continue;
        } else {
          if (ch === '"') { inQuotes = true; i++; continue; }
          if (ch === '\t') { current.push(cell); cell = ''; i++; continue; }
          if (ch === '\n') { current.push(cell); parsedRows.push(current); current = []; cell = ''; i++; continue; }
          cell += ch; i++; continue;
        }
      }
      current.push(cell);
      parsedRows.push(current);
      return parsedRows.filter(r => r.some(c => c && c.trim() !== ''));
    }

    function findHeaderRowIdx(table) {
      for (let idx = 0; idx < Math.min(table.length, 5); idx++) {
        if (table[idx].some(c => (c || '').trim() === '시설사명')) return idx;
      }
      return -1;
    }

    function nthIndexOf(arr, value, n) {
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if ((arr[i] || '').trim() === value) {
          count++;
          if (count === n) return i;
        }
      }
      return -1;
    }

    function buildSheetHeaderMap(headerRow) {
      const map = {};
      const simple = ['참여구분', '지역', '구분', '카테고리', '시설사명', '업체소개', '제공내역', '주소',
                       '유의사항', '운영시간', '마감시간', '휴무일'];
      simple.forEach(key => {
        const idx = headerRow.findIndex(c => (c || '').trim() === key);
        if (idx !== -1) map[key] = idx;
      });
      // 연락처: 1st occurrence = 업체 연락처
      map['연락처'] = nthIndexOf(headerRow, '연락처', 1);
      // 성인/청소년/소인: 1st occurrence = 정상가, 2nd occurrence = 입금가
      map['성인_정상가'] = nthIndexOf(headerRow, '성인', 1);
      map['성인_입금가'] = nthIndexOf(headerRow, '성인', 2);
      map['청소년_정상가'] = nthIndexOf(headerRow, '청소년', 1);
      map['청소년_입금가'] = nthIndexOf(headerRow, '청소년', 2);
      map['소인_정상가'] = nthIndexOf(headerRow, '소인', 1);
      map['소인_입금가'] = nthIndexOf(headerRow, '소인', 2);
      return map;
    }

    function cleanFacilityName(name) {
      return (name || '').replace(/^\[[^\]]*\]\s*/, '').trim();
    }

    function cleanCityName(region) {
      return (region || '').replace(/^\d+\)\s*/, '').trim();
    }

    document.getElementById('parseSheetBtn').addEventListener('click', () => {
      const text = document.getElementById('pasteArea').value;
      const statusEl = document.getElementById('sheetStatus');
      if (!text.trim()) {
        statusEl.textContent = '붙여넣은 내용이 없어요.';
        return;
      }
      const table = parseTSV(text);
      const headerIdx = findHeaderRowIdx(table);
      if (headerIdx === -1) {
        statusEl.textContent = '헤더 행("시설사명" 등)을 찾지 못했어요. 헤더 행을 포함해서 복사했는지 확인해 주세요.';
        return;
      }
      sheetHeaderMap = buildSheetHeaderMap(table[headerIdx]);
      if (sheetHeaderMap['시설사명'] === undefined) {
        statusEl.textContent = '"시설사명" 컬럼을 인식하지 못했어요.';
        return;
      }
      sheetRows = table.slice(headerIdx + 1).filter(r => (r[sheetHeaderMap['시설사명']] || '').trim() !== '');
      statusEl.textContent = `${sheetRows.length}개 업체를 불러왔어요. 아래 탭에서 선택하세요.`;
      document.getElementById('facilityTabs').style.display = 'flex';
      renderFacilityTabs(sheetRows);
    });

    document.getElementById('clearSheetBtn').addEventListener('click', () => {
      document.getElementById('pasteArea').value = '';
      document.getElementById('sheetStatus').textContent = '';
      document.getElementById('facilityTabs').innerHTML = '';
      document.getElementById('facilityTabs').style.display = 'none';
      sheetRows = [];
    });

    let activeTabIdx = null;

    function renderFacilityTabs(list) {
      const wrap = document.getElementById('facilityTabs');
      wrap.innerHTML = '';
      list.forEach((r, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn';
        btn.textContent = cleanFacilityName(r[sheetHeaderMap['시설사명']]);
        if (idx === activeTabIdx) btn.classList.add('active');
        btn.addEventListener('click', () => {
          activeTabIdx = idx;
          wrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          populateForm(r);
        });
        wrap.appendChild(btn);
      });
    }

    document.getElementById('facilitySearch').addEventListener('input', (e) => {
      const q = e.target.value.trim();
      const list = q ? sheetRows.filter(r => (r[sheetHeaderMap['시설사명']] || '').includes(q)) : sheetRows;
      renderFacilityTabs(list);
    });

    function fireInput(id) {
      document.getElementById(id).dispatchEvent(new Event('input', { bubbles: true }));
    }

    function get(r, key) {
      const idx = sheetHeaderMap[key];
      return idx !== undefined && idx !== -1 ? (r[idx] || '').trim() : '';
    }

    function formatPhoneToken(token) {
      const digits = token.replace(/\D/g, '');
      if (digits.length === 11) {
        return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
      }
      if (digits.length === 10) {
        if (digits.startsWith('02')) {
          return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6);
        }
        return digits.slice(0, 3) + '-' + digits.slice(3, 6) + '-' + digits.slice(6);
      }
      if (digits.length === 9 && digits.startsWith('02')) {
        return digits.slice(0, 2) + '-' + digits.slice(2, 5) + '-' + digits.slice(5);
      }
      return token;
    }

    function normalizePhoneText(text) {
      if (!text) return text;
      return text.replace(/\d[\d.\-]{7,12}\d/g, (m) => formatPhoneToken(m));
    }

    function detectReservation(text) {
      const t = text || '';
      if (/유선\s*예약|전화\s*예약|사전\s*예약/.test(t)) return { required: '예', schedule: '전화예약' };
      if (/홈페이지\s*예약/.test(t)) return { required: '예', schedule: '온라인예약' };
      if (/카카오톡/.test(t)) return { required: '예', schedule: '카카오톡예약' };
      if (/네이버/.test(t)) return { required: '아니오', schedule: null };
      return { required: '아니오', schedule: null };
    }

    function populateForm(r) {
      const city = cleanCityName(get(r, '지역'));
      const name = cleanFacilityName(get(r, '시설사명'));

      document.getElementById('f-supplier').value = `[${city}] ${name}`;
      document.getElementById('f-productname').value = `BVT_[충남/${city}] ${name}`;

      document.getElementById('raw-shortdesc').value = get(r, '제공내역');
      fireInput('raw-shortdesc');

      document.getElementById('raw-holiday').value = get(r, '휴무일');
      fireInput('raw-holiday');

      let hoursRaw = get(r, '운영시간');
      const closing = get(r, '마감시간');
      document.getElementById('raw-hours-display').value = hoursRaw;
      if (closing) hoursRaw += ' ' + closing;
      document.getElementById('raw-hours').value = hoursRaw;
      fireInput('raw-hours');

      const noticeText = get(r, '유의사항');
      const resv = detectReservation(noticeText);
      document.getElementById('f-reserve').value = resv.required;
      if (resv.schedule) document.getElementById('f-schedule').value = resv.schedule;

      document.getElementById('raw-notice-visible').value = noticeText;
      document.getElementById('raw-intro-visible').value = get(r, '업체소개');
      document.getElementById('raw-phone-visible').value = normalizePhoneText(get(r, '연락처'));
      document.getElementById('raw-address-plain-visible').value = get(r, '주소');
      generateUsagePreview();

      document.getElementById('raw-region').value = '충남';
      document.getElementById('raw-facilityname-price').value = name;
      document.getElementById('raw-adult-normal').value = get(r, '성인_정상가');
      document.getElementById('raw-adult-settle').value = get(r, '성인_입금가');
      document.getElementById('raw-teen-normal').value = get(r, '청소년_정상가');
      document.getElementById('raw-teen-settle').value = get(r, '청소년_입금가');
      document.getElementById('raw-child-normal').value = get(r, '소인_정상가');
      document.getElementById('raw-child-settle').value = get(r, '소인_입금가');
      syncPriceFields();
    }
  </script>
</div>
</body>
</html>
